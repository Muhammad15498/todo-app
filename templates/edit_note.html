<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Note</h1>
        <form action="{{ url_for('edit_note', note_id=note.id) }}" method="POST" class="note-form">
            <div class="form-row">
                <div class="form-group">
                    <textarea name="note" rows="4" required>{{ note.content }}</textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">Update Note</button>
                </div>
            </div>
        </form>
        <a href="{{ url_for('index', selected_task=note.task_id) }}" class="btn-logout">Back to Notes</a>
    </div>
</body>
</html>
