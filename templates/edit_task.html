<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Task</h1>
        <form action="{{ url_for('edit_task', task_id=task.id) }}" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="task" value="{{ task.task }}" required>
                </div>
                <div class="form-group">
                    <input type="text" name="priority" value="{{ task.priority }}" required>
                </div>
                <div class="form-group">
                    <input type="text" name="due_date" value="{{ task.due_date }}" required>
                </div>
                <div class="form-group">
                    <input type="text" name="category" value="{{ task.category }}" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">Update Task</button>
                </div>
            </div>
        </form>
        <a href="{{ url_for('index') }}" class="btn-logout">Back to To-Do List</a>
    </div>
</body>
</html>
