<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Daily Work Journal</h1>
    <form action="{{ url_for('add_task') }}" method="POST">
        <input type="text" name="task" placeholder="Enter task" required>
        <input type="text" name="task_date" id="task_date" placeholder="dd/mm/yyyy" required>
        <button type="submit">Add Task</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>Task</th>
                <th>Task Date</th>
                <th>Entry Date</th>
                <th>Entry Time</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td><input type="checkbox" name="task_ids" value="{{ task[0] }}"></td>
                <td>{{ task[1] }}</td>
                <td>{{ task[2] }}</td>
                <td>{{ task[3] }}</td>
                <td>{{ task[4] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <form action="{{ url_for('delete_task') }}" method="POST" onsubmit="return confirm('Are you sure you want to delete the selected tasks?');">
        <input type="hidden" name="task_ids" id="task_ids">
        <button type="submit">Delete Selected Tasks</button>
    </form>

    <script>
        // Auto-format date to dd/mm/yyyy
        document.getElementById('task_date').addEventListener('blur', function() {
            let date = this.value.replace(/\D/g, '/');
            let parts = date.split('/');
            if (parts.length === 3) {
                this.value = parts[0].padStart(2, '0') + '/' + parts[1].padStart(2, '0') + '/' + parts[2].padStart(4, '20');
            }
        });

        // Ctrl + ; shortcut for today's date
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === ';') {
                let today = new Date().toLocaleDateString('en-GB');
                document.getElementById('task_date').value = today;
            }
        });

        // Collect selected task IDs for deletion
        document.querySelector('form[onsubmit]').addEventListener('submit', function() {
            let selected = document.querySelectorAll('input[name="task_ids"]:checked');
            let taskIds = Array.from(selected).map(input => input.value);
            document.getElementById('task_ids').value = taskIds.join(',');
        });
    </script>
</body>
</html>
